<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Movie Shelf</title>
<meta name="theme-color" content="#12141C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <h1>Our Movie<span class="dot">.</span>Shelf</h1>
  <div class="mode-tabs">
    <button id="tabMovies" class="active" onclick="setMode('movies')">Movies</button>
    <button id="tabPeople" onclick="setMode('people')">People</button>
    <a href="admin.html" class="btn secondary" style="text-decoration:none; display:flex; align-items:center; padding:8px 12px; font-size:0.85rem;">Admin</a>
  </div>
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="Search titles..." autocomplete="off">
  </div>
  <div class="count-pill" id="countPill"></div>
</div>

<div id="wall" class="wall"></div>
<div id="alphaRail" class="alpha-rail"></div>

<script src="app.js"></script>
</body>
</html>
